name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # assets:check also runs the Luke rig and motion validators.
      - run: npm run assets:check
      - run: npm run test:rig
      - run: npm run test:loading
      - run: npm run test:motion
      - run: npm run test:audio
      - run: npm run build -- --base=/TheArena/
