<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luke rig inspection · Part 1</title>
<style>body{margin:0;background:#e4e9ed;color:#152637;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;top:12px;left:12px;width:275px;max-height:90vh;overflow:auto;background:#fffffff0;padding:14px;border-radius:8px}h1{font-size:18px;margin:0 0 8px}label{display:block;margin:10px 0}select,button{font:inherit;padding:6px}pre{font-size:11px;white-space:pre-wrap}p{line-height:1.4}.views{display:flex;gap:4px}@media(max-width:600px){aside{width:210px;font-size:12px;max-height:38vh}h1{font-size:15px}}</style></head>
<body><canvas id="rig"></canvas><aside><h1>Luke · rig inspection</h1><p>Development only. Grid = 0.25 m. Colored bones, red knees, blue ankles. Luke faces −Z.</p>
<label>Pose <select id="pose"><option>neutral</option><option>right knee</option><option>left knee</option><option>shallow squat</option><option>athletic crouch</option><option>forward step</option><option>wide stance</option><option>torso lean</option><option>arm raise</option><option>ball hold</option><option>move → gather</option><option>loose → pickup</option></select></label>
<label>Writer <select id="writer"><option value="isolated">Isolated stress pose</option><option value="adapter">Procedural adapter + stress pose</option></select></label>
<label><input type="checkbox" id="overlay" checked> Joint and bone overlay</label>
<div class="views"><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="three-quarter">¾</button></div>
<p id="status">Loading canonical Luke…</p><pre id="diagnostics"></pre></aside><script type="module" src="./rig-inspection.js"></script></body></html>
